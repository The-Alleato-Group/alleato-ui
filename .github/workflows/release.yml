name: Release
# Publishes to npm when a vX.Y.Z tag is pushed. Uses npm trusted publishing
# (OIDC): no token is stored. Configure once on npmjs.com under the package's
# settings -> Trusted publisher: GitHub Actions, repo The-Alleato-Group/alleato-ui,
# workflow release.yml.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --access public --provenance
